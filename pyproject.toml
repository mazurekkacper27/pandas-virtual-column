[project]
name = "pandas-virtual-column"
version = "0.1.0"
description = "Virtual columns in pandas and a small sales cleaning pipeline"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test_virtual_column.py", "tests"]

[tool.mypy]
strict = true
files = ["solution.py", "pipeline.py", "tests"]

[tool.ruff]
line-length = 100
# Provided with the task and kept exactly as delivered.
extend-exclude = ["test_virtual_column.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
